name: CLA

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: verificacao do CLA
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Só a branch de assinaturas do repositório base. Nunca o código do PR.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: cla-signatures
          persist-credentials: true
      - name: script do CLA vindo da main (não do PR)
        run: |
          mkdir -p .cla
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.github/cla/verificar.js" -o .cla/verificar.js
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLA_ISENTOS: eibrunocorrea:179166498,dependabot[bot]:49699333
        with:
          script: |
            const fs = require("fs");
            const { executar } = require(`${process.env.GITHUB_WORKSPACE}/.cla/verificar.js`);
            await executar({ github, context, core, exec, fs });
