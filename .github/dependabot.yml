version: 2
updates:
  - package-ecosystem: npm
    directory: /remotion
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    ignore:
      # numpy 2.3+ exige Python 3.11; o engine promete Python 3.10 (engine/requirements.txt).
      - dependency-name: numpy
        versions: [">=2.3"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
